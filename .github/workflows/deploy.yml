name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: coins-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify UI contract and types
        # App-project typecheck (root `tsc --noEmit` missed tsconfig.app.json
        # failures at baseline — see docs/CURRENT_STATE_INVENTORY.md)
        run: |
          npm run test:ui
          npx tsc -p tsconfig.app.json --noEmit

      - name: Build production bundle
        # Public Supabase config comes from GitHub environment/repo variables
        # (anon key only — the service-role key must NEVER be a frontend var).
        # Configure `VITE_SUPABASE_URL` / `VITE_SUPABASE_ANON_KEY` as Actions
        # variables before merging this branch to master (Task 14/16).
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -p 4020 \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            jd@213.165.91.221 \
            'test -d /var/www/jdwd40.com/html/coins && test -w /var/www/jdwd40.com/html/coins'

      - name: Deploy static build
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -p 4020 -o BatchMode=yes" \
            ./dist/ \
            jd@213.165.91.221:/var/www/jdwd40.com/html/coins/

      - name: Verify live deployment
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            https://jdwd40.com/coins/ > /dev/null
